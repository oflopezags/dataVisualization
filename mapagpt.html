
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casos de dengue por municipio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      color: #222;
    }

    h1, p {
      text-align: center;
    }

    #mapa {
      width: 100%;
      overflow-x: auto;
    }

    #mensaje {
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Casos de dengue por municipio</h1>
  <p>Aguascalientes, México | Último trimestre ficticio</p>
  <div id="mensaje">Cargando límites municipales...</div>
  <div id="mapa"></div>

  <script type="module">
    import * as Plot from
      "https://esm.sh/@observablehq/plot@0.6.17";

    // Datos ficticios: número de casos confirmados
    const casosPorMunicipio = {
      "Aguascalientes": 284,
      "Asientos": 42,
      "Calvillo": 87,
      "Cosío": 18,
      "El Llano": 31,
      "Jesús María": 196,
      "Pabellón de Arteaga": 54,
      "Rincón de Romos": 73,
      "San Francisco de los Romo": 65,
      "San José de Gracia": 12,
      "Tepezalá": 24
    };

    const normalizar = texto =>
      String(texto ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    async function crearMapa() {
      try {
        // Servicio GeoJSON municipal del INEGI, clave estatal 01
        const respuesta = await fetch(
          "https://gaia.inegi.org.mx/wscatgeo/v2/geo/mgem/01"
        );

        if (!respuesta.ok) {
          throw new Error("No se pudieron descargar los municipios.");
        }

        const geojson = await respuesta.json();

        // Localizar el nombre del municipio en las propiedades
        const features = geojson.features ?? [];

        if (features.length === 0) {
          throw new Error("El servicio no devolvió polígonos municipales.");
        }

        const municipios = features.map(feature => {
          const p = feature.properties ?? {};

          const nombre =
            p.nomgeo ??
            p.nom_agem ??
            p.NOMGEO ??
            p.NOM_MUN ??
            p.nombre;

          const clave = normalizar(nombre);

          const casos = Object.entries(casosPorMunicipio).find(
            ([municipio]) => normalizar(municipio) === clave
          )?.[1];

          return {
            ...feature,
            properties: {
              ...p,
              nombre: nombre ?? "Municipio sin nombre",
              casos: casos ?? 0
            }
          };
        });

        const mapa = Plot.plot({
          width: 850,
          height: 650,
          margin: 30,

          color: {
            type: "quantize",
            domain: [0, 300],
            scheme: "YlOrRd",
            legend: true,
            label: "Casos confirmados",
            ticks: 6
          },

          marks: [
            Plot.geo(municipios, {
              fill: d => d.properties.casos,
              stroke: "white",
              strokeWidth: 1.5,
              title: d =>
                `${d.properties.nombre}\n` +
                `${d.properties.casos} casos`
            })
          ]
        });

        document.querySelector("#mapa").replaceChildren(mapa);
        document.querySelector("#mensaje").textContent =
          "Mapa ilustrativo: los casos son ficticios.";

      } catch (error) {
        document.querySelector("#mensaje").textContent =
          "No se pudo cargar el mapa: " + error.message +
          ". Comprueba tu conexión a Internet.";
        console.error(error);
      }
    }

    crearMapa();
  </script>
</body>
</html>
